<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Declaração de Residência - DETRAN</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
 
  <div class="container mt-5">
    <h1>Declaração de residência - DETRAN</h1>
 
    <form class="row g-3 mt-1"> 
      <div class="col-md-12">
        <label for="nome" class="form-label">Nome:</label>
        <input type="text" class="form-control" id="nome" placeholder="Digite seu nome">
      </div>
 
      <div class="col-md-12">
        <label for="nomesocial" class="form-label">Nome Social:</label>
        <input type="text" class="form-control" id="nomesocial" placeholder="Digite seu nome social">
      </div>
 
      <div class="col-md-8">
        <label for="id" class="form-label">Documento de Identidade:</label>
        <input type="text" class="form-control" id="id" placeholder="Digite seu documento de identidade">
      </div>
 
      <div class="col-md-4">
        <label for="orgexp" class="form-label">Órgão Expedidor:</label>
        <input type="text" class="form-control" id="orgexp" placeholder="Digite o órgão">
      </div>
 
      <div class="col-md-12">
        <label for="cpf" class="form-label">CPF:</label>
        <input type="text" class="form-control" id="cpf" placeholder="Digite seu CPF">
      </div>
 
      <div class="col-md-8">
        <label for="nacionalidade" class="form-label">Nacionalidade:</label>
        <input type="text" class="form-control" id="nacionalidade" placeholder="Digite sua nacionalidade">
      </div>
 
      <div class="col-md-4">
        <label for="naturalidade" class="form-label">Naturalidade:</label>
        <input type="text" class="form-control" id="naturalidade" placeholder="Digite sua naturalidade">
      </div>
 
      <div class="col-md-8">
        <label for="tel" class="form-label">Telefone:</label>
        <input type="tel" class="form-control" id="tel" placeholder="Digite seu telefone">
      </div>
 
      <div class="col-md-4">
        <label for="celular" class="form-label">Celular:</label>
        <input type="tel" class="form-control" id="celular" placeholder="Digite seu celular">
      </div>
 
      <div class="col-md-12">
        <label for="email" class="form-label">E-mail:</label>
        <input type="email" class="form-control" id="email" placeholder="Digite seu e-mail">
      </div>
 
      <div class="col-md-12">
        <label for="endereco" class="form-label">Endereço:</label>
        <input type="text" class="form-control" id="endereco" placeholder="Digite seu endereço">
      </div>
 
      <div class="col-md-2">
        <label for="n" class="form-label">Número:</label>
        <input type="text" class="form-control" id="n" placeholder="Nº">
      </div>
 
      <div class="col-md-6">
        <label for="complemento" class="form-label">Complemento:</label>
        <input type="text" class="form-control" id="complemento" placeholder="Apto, bloco, ...">
      </div>
 
      <div class="col-md-4">
        <label for="cep" class="form-label">CEP:</label>
        <input type="text" class="form-control" id="cep" placeholder="Digite o CEP">
      </div>
 
      <div class="col-md-2">
        <label for="uf" class="form-label">UF:</label>
        <input type="text" class="form-control" id="uf" placeholder="Digite a UF">
      </div>
 
      <div class="col-md-6">
        <label for="cidade" class="form-label">Cidade:</label>
        <input type="text" class="form-control" id="cidade" placeholder="Digite a cidade">
      </div>
 
      <div class="col-md-4">
        <label for="bairro" class="form-label">Bairro:</label>
        <input type="text" class="form-control" id="bairro" placeholder="Digite o bairro">
      </div>
 
      <div class="col-md-12 mb-5">
        <button type="submit" class="btn btn-primary">Enviar</button>
      </div>
    </form>
  </div>
 
</body>
</html>
